services:
  postgres:
    image: postgres:16-alpine
    container_name: odinpaw-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: odinpaw
      POSTGRES_PASSWORD: odinpaw_dev
      POSTGRES_DB: odinpaw
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
